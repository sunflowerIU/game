name: game-platform-production

x-service-defaults: &service-defaults
  restart: unless-stopped
  init: true
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  caddy:
    <<: *service-defaults
    image: caddy:2.11.4-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:size=16m
    depends_on:
      web:
        condition: service_healthy
      admin-web:
        condition: service_healthy
      server:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:2019/config/",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
    mem_limit: 128m
    cpus: 0.25
  web:
    <<: *service-defaults
    image: ghcr.io/sunfloweriu/game-web:${IMAGE_TAG:?set_IMAGE_TAG}
    environment:
      API_INTERNAL_URL: http://server:4000
    expose:
      - "3000"
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /app/apps/web/.next/cache:size=64m,uid=1000,gid=1000
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 768m
    cpus: 0.5

  admin-web:
    <<: *service-defaults
    image: ghcr.io/sunfloweriu/game-admin-web:${IMAGE_TAG:?set_IMAGE_TAG}
    environment:
      API_INTERNAL_URL: http://server:4000
    expose:
      - "3001"
    read_only: true
    tmpfs:
      - /tmp:size=32m
      - /app/apps/admin-web/.next/cache:size=64m,uid=1000,gid=1000
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3001/",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    mem_limit: 768m
    cpus: 0.5

  server:
    <<: *service-defaults
    image: ghcr.io/sunfloweriu/game-server:${IMAGE_TAG:?set_IMAGE_TAG}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connect_timeout=10
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 4000
      TRUST_PROXY: "true"
      WEB_ORIGIN: https://${PLAYER_HOSTNAME}
      ADMIN_ORIGIN: https://${ADMIN_HOSTNAME}
    expose:
      - "4000"
    read_only: true
    tmpfs:
      - /tmp:size=32m
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:4000/health/ready",
        ]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    stop_grace_period: 20s
    mem_limit: 1g
    cpus: 0.75

  migrate:
    image: ghcr.io/sunfloweriu/game-migrate:${IMAGE_TAG:?set_IMAGE_TAG}
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?connect_timeout=10
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"
    security_opt:
      - no-new-privileges:true

  postgres:
    <<: *service-defaults
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    stop_grace_period: 60s
    shm_size: 256m
    mem_limit: 1536m
    cpus: 0.5

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
