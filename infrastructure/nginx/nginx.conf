user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;
events { worker_connections 2048; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  log_format structured escape=json '{"time":"$time_iso8601","requestId":"$request_id","remote":"$remote_addr","host":"$host","method":"$request_method","uri":"$uri","status":$status,"duration":$request_time}';
  access_log /dev/stdout structured;
  server_tokens off;
  sendfile on;
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_proxied any;
  gzip_vary on;
  gzip_types text/plain text/css application/json application/javascript application/wasm image/svg+xml;
  keepalive_timeout 30s;
  client_max_body_size 64k;
  limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
  real_ip_header CF-Connecting-IP;
  real_ip_recursive on;
  include /etc/nginx/cloudflare-real-ip.conf;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  upstream player_web { server web:3000; keepalive 16; }
  upstream admin_web { server admin-web:3001; keepalive 16; }
  upstream api_server { server server:4000; keepalive 32; }

  server {
    listen 8080;
    server_name ${PLAYER_HOSTNAME} ${ADMIN_HOSTNAME};
    location = /health/live { proxy_pass http://api_server/health/live; }
    location / { return 301 https://$host$request_uri; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name ${PLAYER_HOSTNAME};
    ssl_certificate /run/secrets/origin.pem;
    ssl_certificate_key /run/secrets/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' wss:; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /internal/metrics { return 404; }
    location ^~ /api/v1/admin/ { return 404; }
    location = /api/v1/game-socket {
      proxy_pass http://api_server;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_read_timeout 75s;
    }
    location /_next/static/ { proxy_pass http://player_web; proxy_set_header Host $host; expires 1y; add_header Cache-Control "public, immutable"; }
    location ~ ^/(api|health)/ { limit_req zone=api burst=60 nodelay; proxy_pass http://api_server; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location / { proxy_pass http://player_web; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
  }

  server {
    listen 8443 ssl;
    http2 on;
    server_name ${ADMIN_HOSTNAME};
    ssl_certificate /run/secrets/origin.pem;
    ssl_certificate_key /run/secrets/origin-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /internal/metrics { return 404; }
    location = /api/v1/me { limit_req zone=api burst=20 nodelay; proxy_pass http://api_server; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location ^~ /api/v1/auth/ { limit_req zone=api burst=20 nodelay; proxy_pass http://api_server; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location ^~ /api/v1/admin/ { limit_req zone=api burst=40 nodelay; proxy_pass http://api_server; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
    location ^~ /api/ { return 404; }
    location /_next/static/ { proxy_pass http://admin_web; proxy_set_header Host $host; expires 1y; add_header Cache-Control "public, immutable"; }
    location / { proxy_pass http://admin_web; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Request-Id $request_id; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto https; }
  }

  server { listen 8443 ssl default_server; server_name _; ssl_certificate /run/secrets/origin.pem; ssl_certificate_key /run/secrets/origin-key.pem; return 444; }
}
